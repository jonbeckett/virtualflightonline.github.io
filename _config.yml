title: VirtualFlight.Online
description: Your online home for virtual flight simulation
remote_theme: just-the-docs/just-the-docs

url: "https://virtualflightonline.github.io"

# Aux links in top-right navigation
aux_links:
  "Airline":
    - "https://airline.virtualflight.online"
  "Radar":
    - "https://transmitter.virtualflight.online/radar"
  "Discord":
    - "https://bit.ly/virtualflightonlinediscord"
aux_links_new_tab: true

# Footer content
footer_content: "&copy; Virtual Flight Online"

# Edit on GitHub link in footer
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/jonbeckett/virtualflightonline.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Color scheme
color_scheme: light

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Enable or disable the search feature
search_enabled: true

# Ctrl+K / Cmd+K to focus search
search:
  focus_shortcut_key: 'k'

# Heading anchor links
heading_anchors: true

# Mermaid diagram support
mermaid:
  version: "9.1.3"

# Callouts
callouts:
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: blue
  tip:
    title: Tip
    color: green
  highlight:
    color: yellow
